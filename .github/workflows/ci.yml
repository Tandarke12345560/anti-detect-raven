# CI

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build forkDebug APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install Android SDK pieces
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wget
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;29.0.14206865" "build-tools;37.0.0" "platforms;android-37.2" >/dev/null || true

      - name: Patch android-components (standalone layout)
        run: bash automation/iceraven/patch_android_components.sh

      - name: Python venv + glean_parser
        run: |
          python3 -m venv venv
          venv/bin/pip install "glean_parser~=20.1" pyyaml

      - name: Generate crash reporter sources
        run: venv/bin/python automation/iceraven/toolkit/crashreporter/generate_crash_reporter_sources.py

      - name: Build forkDebug
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: ./gradlew app:assembleForkDebug -PversionName=0.1.0-adr --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: anti-detect-raven-apks
          path: gradle/build/app/outputs/apk/forkDebug/*.apk
          if-no-files-found: error
