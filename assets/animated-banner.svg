<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Anti-Detect-Raven animasyonlu banner">
  <title>Anti-Detect-Raven — animasyonlu banner</title>

  <defs>
    <pattern id="dotgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#999b9b" opacity="0.45"/>
    </pattern>
    <radialGradient id="tealGlow">
      <stop offset="0" stop-color="#15c0cc" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#15c0cc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow">
      <stop offset="0" stop-color="#2ecc59" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2ecc59" stop-opacity="0"/>
    </radialGradient>

    <!-- raven mark: halka + turkuaz nokta + geometrik raven -->
    <g id="rmark">
      <circle cx="100" cy="100" r="87" fill="none" stroke="#ffffff" stroke-width="14"/>
      <circle cx="100" cy="100" r="72" fill="#15c0cc"/>
      <g transform="translate(100 100) scale(0.95) translate(-100 -100)">
        <path d="M160 92 L132 64 Q114 50 94 58 Q72 68 62 94 Q54 118 50 146 L84 126 Q100 140 118 130 Q136 118 140 104 Z"
              fill="#000000" stroke-linejoin="round"/>
        <path d="M74 106 Q94 112 106 126" fill="none" stroke="#15c0cc" stroke-width="8" stroke-linecap="round"/>
        <circle cx="134" cy="84" r="6" fill="#ffffff"/>
      </g>
    </g>
  </defs>

  <!-- zemin -->
  <rect width="800" height="400" fill="#000000"/>
  <rect width="800" height="400" fill="url(#dotgrid)" opacity="0.55"/>
  <circle cx="670" cy="70" r="300" fill="url(#tealGlow)"/>
  <circle cx="80" cy="370" r="240" fill="url(#greenGlow)"/>

  <!-- uçan turkuaz raven noktası (rota üzerinde) -->
  <circle r="7" fill="#15c0cc">
    <animateMotion dur="9s" repeatCount="indefinite"
      path="M 250 240 C 380 120, 520 300, 700 170"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#2ecc59">
    <animateMotion dur="9s" begin="0.4s" repeatCount="indefinite"
      path="M 250 240 C 380 120, 520 300, 700 170"/>
  </circle>

  <!-- logo -->
  <g transform="translate(48 40) scale(0.62)">
    <use href="#rmark"/>
  </g>

  <!-- başlık + slogan -->
  <text x="200" y="108" font-family="sans-serif" font-size="44" font-weight="700" fill="#ffffff">Anti-Detect-Raven</text>
  <text x="202" y="148" font-family="sans-serif" font-size="22" font-style="italic" fill="#15c0cc">İz bırakma, raven gibi uç.</text>
  <text x="202" y="182" font-family="sans-serif" font-size="14" fill="#999b9b">GeckoView + RFP · Persona sistemi · Profil izolasyonu</text>

  <!-- progress barlar -->
  <g font-family="monospace" font-size="13">
    <text x="60" y="238" fill="#ffffff">RFP</text>
    <rect x="120" y="228" width="240" height="14" rx="7" fill="#272626"/>
    <rect x="120" y="228" width="0"   height="14" rx="7" fill="#15c0cc">
      <animate attributeName="width" values="0;226" dur="2.4s" fill="freeze" repeatCount="indefinite"/>
    </rect>
    <text x="370" y="238" fill="#15c0cc">%94</text>

    <text x="60" y="272" fill="#ffffff">Persona</text>
    <rect x="120" y="262" width="240" height="14" rx="7" fill="#272626"/>
    <rect x="120" y="262" width="0"   height="14" rx="7" fill="#2ecc59">
      <animate attributeName="width" values="0;158" dur="3s" begin="0.6s" fill="freeze" repeatCount="indefinite"/>
    </rect>
    <text x="370" y="272" fill="#2ecc59">%66</text>

    <text x="60" y="306" fill="#ffffff">Profil</text>
    <rect x="120" y="296" width="240" height="14" rx="7" fill="#272626"/>
    <rect x="120" y="296" width="0"   height="14" rx="7" fill="#999b9b">
      <animate attributeName="width" values="0;86" dur="3.6s" begin="1.1s" fill="freeze" repeatCount="indefinite"/>
    </rect>
    <text x="370" y="306" fill="#999b9b">%36</text>
  </g>

  <!-- terminal kutusu: kayan hex ticker + blink cursor -->
  <g>
    <rect x="430" y="222" width="330" height="110" rx="12" fill="#000000" stroke="#272626" stroke-width="2"/>
    <clipPath id="tickerClip"><rect x="446" y="236" width="300" height="22"/></clipPath>
    <g clip-path="url(#tickerClip)" font-family="monospace" font-size="14">
      <text x="446" y="252" fill="#2ecc59">
        #000000&#160;&#160;#272626&#160;&#160;#15c0cc&#160;&#160;#999b9b&#160;&#160;#2ecc59&#160;&#160;&#160;&#160;
        <animate attributeName="x" values="446;-160" dur="7s" repeatCount="indefinite"/>
      </text>
    </g>
    <text x="446" y="286" font-family="monospace" font-size="13" fill="#999b9b">$ gradlew assembleForkDebug</text>
    <text x="446" y="310" font-family="monospace" font-size="13" fill="#2ecc59">&#10003; BUILD SUCCESSFUL
      <animate attributeName="opacity" values="1;0" dur="1.2s" repeatCount="indefinite"/>
    </text>
    <rect x="530" y="300" width="9" height="14" fill="#2ecc59">
      <animate attributeName="opacity" values="1;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- swatch şeridi -->
  <g>
    <rect x="40"  y="352" width="128" height="30" rx="10" fill="#272626"/>
    <rect x="188" y="352" width="128" height="30" rx="10" fill="#15c0cc"/>
    <rect x="336" y="352" width="128" height="30" rx="10" fill="#999b9b"/>
    <rect x="484" y="352" width="128" height="30" rx="10" fill="#2ecc59"/>
    <rect x="632" y="352" width="128" height="30" rx="10" fill="#ffffff"/>
    <text x="104" y="372" text-anchor="middle" font-family="monospace" font-size="12" fill="#999b9b">#000000</text>
    <text x="252" y="372" text-anchor="middle" font-family="monospace" font-size="12" fill="#000000">#15c0cc</text>
    <text x="400" y="372" text-anchor="middle" font-family="monospace" font-size="12" fill="#000000">#999b9b</text>
    <text x="548" y="372" text-anchor="middle" font-family="monospace" font-size="12" fill="#000000">#2ecc59</text>
    <text x="696" y="372" text-anchor="middle" font-family="monospace" font-size="12" fill="#272626">#ffffff</text>
  </g>
</svg>
